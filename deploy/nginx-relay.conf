# Tunnel protocol v2 (streaming responses + WebSocket forwarding) needs the
# Upgrade/Connection header pair on the proxied route.
#
# This `map` must live in the `http` block. If this file is included from inside
# a `server` block, move it up into `http { ... }` (conf.d/*.conf snippets are
# already inside `http`).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name relay.zero469.dpdns.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.zero469.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/zero469.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zero469.dpdns.org/privkey.pem;

    location /relay/ {
        proxy_pass http://127.0.0.1:3000;
        # Relay requires HTTP/1.1 from nginx: WebSocket is served through
        # http.Hijacker, which HTTP/2 cannot do (relay answers 426 otherwise).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for tunneled terminal sessions.
        # nginx cannot upgrade a WebSocket that arrived over HTTP/2, so clients
        # must use HTTP/1.1 for WS; `http2` on `listen` only helps plain requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE streams and WebSocket frames must pass through untouched:
        # buffering delays the first event, caching can drop a stream, and the
        # old 130s timeout cut long-lived streams. Both directions are long-lived.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
