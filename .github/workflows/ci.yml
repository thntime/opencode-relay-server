name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The download module resolves https-proxy-agent lazily, so the package
      # dependencies must be present for the proxy tests to exercise it.
      - name: Install package dependencies
        working-directory: npm/opencode-tunnel
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run npm download tests
        working-directory: npm/opencode-tunnel
        run: node --test scripts/download.test.js
