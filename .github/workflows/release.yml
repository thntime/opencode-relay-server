name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm client tests
        run: node --test npm/opencode-tunnel/scripts/download.test.js

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build tunnel-client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          go build -ldflags "-X main.buildVersion=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.buildCommit=${GITHUB_SHA}" -o tunnel-client-${{ matrix.suffix }} ./cmd/tunnel-client

      # Only Linux artifacts can execute on this ubuntu-latest runner. The macOS
      # and Windows binaries are cross-compiled, so running them here would fail
      # with an exec-format error instead of a version check.
      - name: Smoke test binary version
        if: matrix.goos == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="tunnel-client-${{ matrix.suffix }}"
          chmod +x "$BIN"
          OUTPUT=$(./"$BIN" --version)
          echo "$OUTPUT"
          case "$OUTPUT" in
            *"$VERSION"*) ;;
            *)
              echo "::error::$BIN --version did not contain $VERSION"
              exit 1
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-client-${{ matrix.suffix }}
          path: tunnel-client-${{ matrix.suffix }}

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name 'tunnel-client-*' -exec mv {} release/ \;
          cd release
          sha256sum tunnel-client-* > SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm token
        working-directory: npm/opencode-tunnel
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured; skipping npm publish is not allowed for a release tag."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update package version
        working-directory: npm/opencode-tunnel
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm/opencode-tunnel
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
